# Incluir no server de grupoalvim.com.br, no mesmo bloco de /auditoria/.
# App escuta em 127.0.0.1:3018

location = /financas {
    return 302 /financas/;
}

location /financas/ {
    proxy_pass http://127.0.0.1:3018/financas/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
